{% extends "base.html" %}

{% block content %}
  <h1>
    ToDo List
    <a href="{% url 'todo_list:task-create' %}" class="btn btn-primary link-to-page">
      Create
    </a>
  </h1>

  {% if task_list %}
    <table class="table">
      <tr>
        <th>ID</th>
        <th>Task</th>
        <th>Update</th>
        <th>Delete</th>
      </tr>

      {% for task in taskr_list %}
        <tr>
          <td>
              {{ task.id }}
          </td>
          <td>
              {{ task.content }}
          </td>
          <td>
              <a href="{% url 'todo_list:task-update' pk=task.id %}">
                Update
              </a>
            </td>
            <td>
              <a style="color: red"
                href="{% url 'todo_list:task-delete' pk=task.id %}">
                Delete
              </a>
            </td>
        </tr>
      {% endfor %}
    </table>

  {% else %}
      <p>There are no tasks in the ToDo list.</p>
  {% endif %}
{% endblock %}
